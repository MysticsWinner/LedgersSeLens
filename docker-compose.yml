version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  postgres-shard-1:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ledger_shard_1
    volumes:
      - pgdata1:/var/lib/postgresql/data

  postgres-shard-2:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ledger_shard_2
    volumes:
      - pgdata2:/var/lib/postgresql/data

  postgres-shard-3:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ledger_shard_3
    volumes:
      - pgdata3:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api1:
    build: .
    environment:
      - SHARD_1_URL=postgresql://postgres:postgrespassword@postgres-shard-1:5432/ledger_shard_1
      - SHARD_2_URL=postgresql://postgres:postgrespassword@postgres-shard-2:5432/ledger_shard_2
      - SHARD_3_URL=postgresql://postgres:postgrespassword@postgres-shard-3:5432/ledger_shard_3
      - REDIS_URL=redis://redis:6379
      - ZOOKEEPER_URL=zookeeper:2181
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HOSTNAME=node-1
    depends_on:
      - postgres-shard-1
      - postgres-shard-2
      - postgres-shard-3
      - redis
      - zookeeper
      - kafka

  api2:
    build: .
    environment:
      - SHARD_1_URL=postgresql://postgres:postgrespassword@postgres-shard-1:5432/ledger_shard_1
      - SHARD_2_URL=postgresql://postgres:postgrespassword@postgres-shard-2:5432/ledger_shard_2
      - SHARD_3_URL=postgresql://postgres:postgrespassword@postgres-shard-3:5432/ledger_shard_3
      - REDIS_URL=redis://redis:6379
      - ZOOKEEPER_URL=zookeeper:2181
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HOSTNAME=node-2
    depends_on:
      - postgres-shard-1
      - postgres-shard-2
      - postgres-shard-3
      - redis
      - zookeeper
      - kafka

  api3:
    build: .
    environment:
      - SHARD_1_URL=postgresql://postgres:postgrespassword@postgres-shard-1:5432/ledger_shard_1
      - SHARD_2_URL=postgresql://postgres:postgrespassword@postgres-shard-2:5432/ledger_shard_2
      - SHARD_3_URL=postgresql://postgres:postgrespassword@postgres-shard-3:5432/ledger_shard_3
      - REDIS_URL=redis://redis:6379
      - ZOOKEEPER_URL=zookeeper:2181
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HOSTNAME=node-3
    depends_on:
      - postgres-shard-1
      - postgres-shard-2
      - postgres-shard-3
      - redis
      - zookeeper
      - kafka

  worker1:
    build: .
    command: ["python", "worker.py"]
    environment:
      - SHARD_1_URL=postgresql://postgres:postgrespassword@postgres-shard-1:5432/ledger_shard_1
      - SHARD_2_URL=postgresql://postgres:postgrespassword@postgres-shard-2:5432/ledger_shard_2
      - SHARD_3_URL=postgresql://postgres:postgrespassword@postgres-shard-3:5432/ledger_shard_3
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
      - postgres-shard-1
      - postgres-shard-2
      - postgres-shard-3

  worker2:
    build: .
    command: ["python", "worker.py"]
    environment:
      - SHARD_1_URL=postgresql://postgres:postgrespassword@postgres-shard-1:5432/ledger_shard_1
      - SHARD_2_URL=postgresql://postgres:postgrespassword@postgres-shard-2:5432/ledger_shard_2
      - SHARD_3_URL=postgresql://postgres:postgrespassword@postgres-shard-3:5432/ledger_shard_3
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
      - postgres-shard-1
      - postgres-shard-2
      - postgres-shard-3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  pgdata1:
  pgdata2:
  pgdata3:
